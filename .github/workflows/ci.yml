# push と PR のたびにテストを回す
name: ci

on:
  push:
    paths: ["stock-advisor/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["stock-advisor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-advisor/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m advisor --synthetic screen
      - run: python -m advisor --synthetic backtest --start 2019-01-01
