# 平日の東証の引け後に「今日の買う候補」を出して reports/ に保存する（お金は動かさない）
name: stock-screen

on:
  schedule:
    - cron: "10 8 * * 1-5"   # 17:10 JST（東証は 15:30 に引け。Yahoo のデータ反映を待つ）
  push:
    paths: [".github/workflows/stock-screen.yml", "stock-advisor/data/paper-portfolio.json"]   # 口座を作った/直した日に1回動かす
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-advisor/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: 今日の候補を出す
        run: python -m advisor screen --save
      - name: 紙上の口座を回す（data/paper-portfolio.json がコミットされているときだけ。4列の分割入れ替えなので毎日回す）
        run: |
          if [ -f data/paper-portfolio.json ]; then
            python -m advisor paper auto --lot 1 --save   # 50 万円の口座なので 1 株単位（単元未満株）
          else
            echo "紙上の口座なし（paper init して data/paper-portfolio.json をコミットすると回る）"
          fi
      - name: reports/ と口座をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/paper-portfolio.json 2>/dev/null || git add reports/
          git diff --cached --quiet || git commit -m "stock-advisor: $(date -u +%Y-%m-%d) の候補"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # 走っている間に別の push があっても止まらない
          git push
